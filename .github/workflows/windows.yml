name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check code
        run: python -m ruff check src tests scripts
      - name: Install and verify private Windows runtimes
        shell: powershell
        run: ./scripts/setup-windows.ps1
      - name: Test real engines and document preservation
        env:
          SPELLCHECK_INTEGRATION: '1'
        run: python -m pytest -q
      - name: Build portable application
        run: python scripts/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: Spellcheck-Tool-Windows
          path: dist/Spellcheck-Tool-Windows.zip
          retention-days: 30
          if-no-files-found: error
