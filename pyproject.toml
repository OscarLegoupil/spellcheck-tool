[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spellcheck-tool"
version = "1.0.0"
description = "Local Finnish and English proofreading with precise PDF and Word annotations"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "PyMuPDF==1.26.7", "lxml==6.0.2", "fastapi==0.119.0",
  "uvicorn==0.37.0", "python-multipart==0.0.20", "libvoikko==4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "python-docx==1.2.0"]

[project.scripts]
spellcheck-tool = "spellcheck_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spellcheck_tool = ["static/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires installed local linguistic engines"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
